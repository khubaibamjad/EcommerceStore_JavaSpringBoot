spring.application.name=ecommerce

spring.datasource.url = jdbc:h2:file:./data/ecommerceDB
spring.datasource.driver-class-name=org.h2.Driver
spring.datasource.username =  sa
spring.datasource.password =

spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.h2.console.enabled=true
spring.h2.console.path=/h2-console

management.endpoints.web.exposure.include=*

management.endpoint.health.show-details=always

management.info.env.enabled=true

info.app.name=MyEcommerceStore
info.app.description=My Application description
info.app.versin=1.0.1

management.endpoint.shutdown.enabled=true
management.endpoint.shutdown.access=unrestricted

jwt.secret=mystoresecretkeymystoresecretkeymystoresecretkey

logging.level.org.springframework.security=DEBUG
